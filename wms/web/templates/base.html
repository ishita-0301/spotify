<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workload Management System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <div class="brand">🎧 Workload Management System</div>
    <nav>
      {% if current_user %}
      <a href="{{ url_for('index') }}">Dashboard</a>
      <a href="{{ url_for('analytics') }}">Analytics</a>
      <span class="who">{{ current_user.name }}
        <span class="tag {{ 'tier-prem' if current_user.tier == 'PREMIUM' else 'tier-free' }}">{{ current_user.tier }}</span>
      </span>
      <form action="{{ url_for('logout') }}" method="post" class="inline">
        <button type="submit" class="ghost">Log out</button>
      </form>
      {% else %}
      <a href="{{ url_for('login') }}">Log in</a>
      <a href="{{ url_for('signup') }}">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    OS-scheduled &amp; AI-powered playlist generator · Team CodingLeague (T-229)
  </footer>
</body>
</html>
