{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h2>Create an account</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form action="{{ url_for('signup') }}" method="post" class="stack">
    <label>Username
      <input type="text" name="name" value="{{ name }}" autofocus required />
    </label>
    <label>Password
      <input type="password" name="password" required />
    </label>
    <label>Tier
      <select name="tier">
        <option value="FREE" selected>FREE</option>
        <option value="PREMIUM">PREMIUM</option>
      </select>
    </label>
    <button type="submit">Sign up</button>
  </form>
  <p class="muted">Your tier sets your share of the API budget under the fair
    schedulers (PREMIUM is weighted ~3&times; higher under WFQ).</p>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in →</a></p>
</section>
{% endblock %}
